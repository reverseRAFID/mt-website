name: Deploy to Vercel

on:
  push:
    branches:
      - main      # Production deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match local/Vercel (Node 24 / npm 11).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is generated on Windows, where
        # npm omits the Linux-only wasm transitive optional deps (@emnapi/runtime,
        # @emnapi/core via @tailwindcss/oxide-wasm32-wasi). `npm ci` rejects that as
        # out-of-sync on the Linux runner; `npm install` reconciles it. Vercel's
        # build uses `npm install` for the same reason.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      # `next build` no longer runs ESLint (Next 16 removed it), so lint is its
      # own step or it stops being checked at all.
      - name: Lint
        run: npm run lint

      # Static privacy and access guards. These read source, not a database, so
      # they need nothing provisioned — and they are the cheapest possible place
      # to catch a collection shipped without an access block.
      - name: Privacy and access guards
        run: npm run check:privacy

      # Deploy with the current Vercel CLI directly. The old amondnet/vercel-action
      # pinned Vercel CLI 25.x, which Vercel's API now rejects ("requires version
      # 47.2.2 or later"). ORG/PROJECT ids are read from env by the CLI for linking.
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview)
        if: github.ref == 'refs/heads/develop'
        run: vercel deploy --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
