name: Deploy to Vercel

on:
  push:
    branches:
      - main      # Production deploy
      - develop   # Preview deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match local/Vercel (Node 24 / npm 11).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `npm install`, not `npm ci`: the lockfile is generated on Windows, where
        # npm omits the Linux-only wasm transitive optional deps (@emnapi/runtime,
        # @emnapi/core via @tailwindcss/oxide-wasm32-wasi). `npm ci` rejects that as
        # out-of-sync on the Linux runner; `npm install` reconciles it. Vercel's
        # build uses `npm install` for the same reason.
        run: npm install --no-audit --no-fund

      - name: Run type check
        run: npx tsc --noEmit

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview)
        if: github.ref == 'refs/heads/develop'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
